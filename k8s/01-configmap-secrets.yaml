apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  ENVIRONMENT: "k8s-production"
  CLOUD_TIER: "Public Kubernetes Node (Auto-Scaled)"
  PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_URL: "sqlite:////app/data/ecommerce.db"
  API_SECRET_KEY: "cloudmart-production-secret-key-k8s"
