apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-ecommerce-api
  namespace: ecommerce
  labels:
    tier: public-cloud-api
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: public-cloud-api
  template:
    metadata:
      labels:
        tier: public-cloud-api
    spec:
      containers:
        - name: api
          image: ecommerce-backend:latest
          env:
            - name: ENVIRONMENT
              value: "hybrid-public-cloud"
            - name: CLOUD_TIER
              value: "Public Cloud (Worker Tier)"
            # Secure connection to the Private On-Premises DB over tunnel
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hybrid-private-tunnel-secret
                  key: REMOTE_DB_URL
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: public-api-service
  namespace: ecommerce
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    tier: public-cloud-api
