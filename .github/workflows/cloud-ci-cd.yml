name: Cloud-Native CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Health & Schema Verification
        run: |
          cd backend
          python -c "import main, database, models, schemas; print('Application integrity check passed!')"

  docker-build:
    name: Container Build Verification
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Backend Docker Image
        run: docker build -t ecommerce-backend:latest backend/

      - name: Build Frontend Docker Image
        run: docker build -t ecommerce-frontend:latest frontend/

  k8s-validate:
    name: Kubernetes Manifest Validation
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate Kubernetes Manifests
        run: |
          docker run --rm -v $(pwd)/k8s:/manifests ghcr.io/yannh/kubeconform:latest /manifests/*.yaml
